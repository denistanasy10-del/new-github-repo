[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frameflow"
version = "0.1.0"
description = "A local-first tool for organizing photo collections."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
frameflow = "frameflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
